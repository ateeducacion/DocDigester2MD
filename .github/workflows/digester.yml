name: DocDigester2MD

on:
  push:
    paths:
      - "input/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Runs inside the pre-built GHCR image (deps baked in → no pip install).
      # Requires the "Build & Push Docker image" workflow to have published the
      # image at least once.
      - name: Run DocDigester2MD
        uses: ./
        with:
          ai_api_key: ${{ secrets.AI_API_KEY }}
          ai_base_url: ${{ secrets.AI_BASE_URL }}
          ai_model: ${{ secrets.AI_MODEL }}

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/ processed.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit — nothing new was processed."
            exit 0
          fi

          # Build commit message from list of newly generated .md files
          CHANGED=$(git diff --staged --name-only \
            | grep -E '^output/.*\.md$' \
            | sed 's|output/||' \
            | paste -sd ', ' -)

          if [ -n "$CHANGED" ]; then
            MSG="chore: digest ${CHANGED}"
          else
            MSG="chore: update digester state"
          fi

          git commit -m "$MSG"
          git push
