name: Build & Push Docker image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "requirements-audio.txt"
      - "entrypoint.sh"
      - "DocDigester2MD.py"
      - "docdigester.yaml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/docdigester2md

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Normalize image name to lowercase
        run: echo "IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tag
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push light image (default)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            INCLUDE_AUDIO=false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push audio image (with Whisper/torch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            INCLUDE_AUDIO=true
          tags: |
            ${{ env.IMAGE }}:audio
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}-audio
          cache-from: type=gha
          cache-to: type=gha,mode=max
